name: Atualizar feed do Google

on:
  schedule:
    - cron: '17 * * * *'   # de hora em hora (horário UTC)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Se a Tray falhar, o PHP sai com erro e nada é publicado:
      # o Google continua lendo os últimos XMLs bons.
      - name: Gerar XMLs a partir da Tray
        env:
          TRAY_URL: ${{ secrets.TRAY_URL }}
        run: |
          mkdir -p site
          php google-feed.php local > site/local.xml
          php google-feed.php produtos > site/produtos.xml

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
